include "/etc/bind/lab/dnspool.key";

options {
  directory "/var/cache/bind";
  listen-on { any; };
  listen-on-v6 { none; };
  recursion no;
  allow-query { any; };
  dnssec-validation no;
};

zone "lab.internal" {
  type primary;
  file "/var/cache/bind/db.lab.internal";
  update-policy {
    grant dnspool-key subdomain lab.internal. A AAAA TXT;
  };
};
